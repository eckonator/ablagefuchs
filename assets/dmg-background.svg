<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <!-- SPDX-License-Identifier: MIT OR Apache-2.0 -->
  <!-- Hintergrund des macOS-Installationsfensters (DMG). Mittlerer Ton, damit die Finder-Beschriftungen der Symbole
       im hellen (schwarz) und dunklen Modus (weiß) lesbar bleiben. Alles Wichtige in den oberen 400 pt: neuere
       Finder zeigen Tab- und Pfadleiste und verdecken ein Stück. Rendern: scripts/make-dmg-background.sh -->
  <defs>
    <style>
      text { font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
      text.mono { font-family: Menlo, Monaco, monospace; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c4d4"/>
      <stop offset="1" stop-color="#97a5b8"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#e2611b"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-50%" width="140%" height="200%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="1.5" fill="#fff" opacity="0.45"/>

  <text x="320" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#132741" letter-spacing="0.5">Ablagefuchs</text>
  <rect x="290" y="64" width="20" height="3" rx="1.5" fill="#2f6fed"/>
  <rect x="310" y="64" width="20" height="3" rx="1.5" fill="#1f9d55"/>
  <rect x="330" y="64" width="20" height="3" rx="1.5" fill="#c98500"/>

  <!-- Pfeil von der App (links) zu Programme (rechts) -->
  <g filter="url(#drop)">
    <rect x="248" y="171" width="122" height="14" rx="7" fill="url(#arrow)"/>
    <path d="M366 156 L398 178 L366 200 Z" fill="#e2611b" stroke="#e2611b" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <text x="320" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#132741" letter-spacing="0.5">DRAG TO APPLICATIONS</text>

  <!-- Hinweis zum ersten Start (App ist nicht von Apple notarisiert). „Dennoch öffnen“ hilft ab Sequoia oft nicht. -->
  <rect x="40" y="282" width="560" height="110" rx="8" fill="#132741" opacity="0.9"/>
  <text x="320" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#ff9a3c">macOS says the app “cannot be verified”?</text>
  <text x="320" y="327" text-anchor="middle" font-size="12" fill="#e3e9f2">After dragging it to Applications, run this once in Terminal:</text>
  <rect x="58" y="336" width="524" height="24" rx="4" fill="#0a1626"/>
  <text x="320" y="352.5" text-anchor="middle" class="mono" font-size="11.5" fill="#7fb2ff" xml:space="preserve">xattr -dr com.apple.quarantine "/Applications/Ablagefuchs.app"</text>
  <text x="320" y="380" text-anchor="middle" font-size="11" fill="#a9b6c8">or install with the one-line Terminal command from the README</text>
</svg>

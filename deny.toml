# Prüfung der Abhängigkeiten mit cargo-deny (läuft in der CI):
# Lizenzen müssen zu MIT OR Apache-2.0 passen (kein GPL/AGPL), bekannte Sicherheitslücken brechen ab.

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[advisories]
ignore = [
    # ttf-parser ist nicht mehr gepflegt, kommt aber nur über winit/eframe (Fensterdeko unter Linux).
    # Kein Ersatz verfügbar; prüfen, sobald eframe umsteigt.
    { id = "RUSTSEC-2026-0192", reason = "transitiv über eframe, keine Alternative" },
    # zbus_names, zvariant und zvariant_derive sind in zbus 6 aufgegangen und erscheinen nicht mehr einzeln.
    # Sie kommen nur über eframe → accesskit (Bedienungshilfen unter Linux); keine Sicherheitslücke, nur
    # „nicht mehr gepflegt“. Prüfen, sobald eframe/accesskit auf zbus 6 umsteigen.
    { id = "RUSTSEC-2026-0370", reason = "transitiv über eframe/accesskit, nur unmaintained" },
    { id = "RUSTSEC-2026-0371", reason = "transitiv über eframe/accesskit, nur unmaintained" },
    { id = "RUSTSEC-2026-0372", reason = "transitiv über eframe/accesskit, nur unmaintained" },
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9

# Die eingebauten egui-Schriften stehen unter Schriftlizenzen; sie dürfen mit MIT/Apache-Software
# verteilt werden (Lizenztexte kommen in THIRD-PARTY-LICENSES).
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

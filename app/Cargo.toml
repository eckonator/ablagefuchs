[package]
name = "ablagefuchs"
description = "Gescannte PDFs sichten und sinnvoll umbenennen"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
af-core.workspace = true
af-pdf.workspace = true
af-ocr.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
eframe = { version = "0.36", features = ["glow"] }
rfd = "0.17"
dirs = "7"
sys-locale = "0.3"
# „pure“: ohne C/Assembler, baut damit überall gleich (auch beim Gegencheck für Windows auf dem Mac)
blake3 = { version = "1", features = ["pure"] }
trash = "5"

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1"
plist = "1"
